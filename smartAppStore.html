<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

       <!-- Primary SEO Tags -->

<style>
    /* ========= DEFAULT LIGHT THEME ========= */
    body {
        margin: 0;
        background: #f5f5f5;
        font-family: Arial;
        color: #111;
    }

    header {
        background: #ffffff;
        padding: 20px;
        text-align: center;
        font-weight: bold;
        font-size: 20px;
        border-bottom: 1px solid #ddd;
        position: sticky;
        top: 0;
        z-index: 10;
    }

    #themeToggle {
        position: absolute;
        right: 15px;
        top: 20px;
        padding: 6px 12px;
        font-size: 14px;
        cursor: pointer;
        border-radius: 6px;
        border: 1px solid #ccc;
        background: #fff;
    }

    #searchBox {
        width: 90%;
        padding: 12px;
        margin: 15px auto;
        display: block;
        font-size: 15px;
        border-radius: 6px;
        border: 1px solid #ccc;
    }

    .category-area {
        text-align: center;
        margin-top: 10px;
    }

    .cat-btn {
        padding: 8px 12px;
        margin: 5px;
        border-radius: 5px;
        border: 1px solid #aaa;
        background: #fff;
        cursor: pointer;
        font-size: 14px;
    }

    .cat-btn.active {
        background: #3498db;
        border-color: #3498db;
        color: white;
    }

    .app-list {
        max-width: 900px;
        margin: 10px auto;
        padding: 0 10px;
    }

    .app-card {
        background: white;
        padding: 14px;
        border-radius: 12px;
        display: flex;
        gap: 15px;
        border: 1px solid #ddd;
        align-items: center;
        margin-bottom: 14px;
        cursor: pointer;
    }

    .app-card img {
        width: 70px;
        height: 70px;
        border-radius: 12px;
        object-fit: cover;
    }

    .app-title {
        font-size: 18px;
        font-weight: bold;
    }

    .app-desc {
        font-size: 14px;
        color: #555;
    }

    .download-btn {
        padding: 10px 14px;
        background: #3498DB;
        border: none;
        border-radius: 6px;
        color: white;
        cursor: pointer;
    }

    /* ===== POPUP ===== */
    .popup-bg {
        position: fixed;
        top: 0; 
        left: 0;
        width: 100%; 
        height: 100%;
        background: rgba(0,0,0,0.5);
        display: none;
        justify-content: center;
        align-items: center;
        padding: 15px;
    }

    .popup-box {
        background: white;
        padding: 20px;
        border-radius: 12px;
        max-width: 400px;
        width: 100%;
        text-align: center;
    }

    .popup-title {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 10px;
    }

    .popup-text {
        font-size: 14px;
        margin-bottom: 15px;
        color: #444;
    }

    .version-text {
        font-weight: bold;
        margin-bottom: 10px;
        font-size: 15px;
    }

    .close-btn {
        margin-top: 10px;
        padding: 7px 12px;
        background: #888;
        border: none;
        color: white;
        border-radius: 5px;
        cursor: pointer;
    }

    /* ========= DARK MODE COLORS ========= */
    body.dark { 
        background: #0d0d0d; 
        color: #eee; 
    }

    body.dark header { 
        background: #111; 
        color: white; 
        border-color: #222; 
    }

    body.dark #searchBox { 
        background: #1a1a1a; 
        border-color: #444; 
        color: #eee; 
    }

    body.dark .cat-btn { 
        background: #1a1a1a; 
        border-color: #555; 
        color: #eee; 
    }

    body.dark .app-card { 
        background: #1a1a1a; 
        border-color: #333; 
    }

    body.dark .app-desc { 
        color: #ccc; 
    }

    body.dark .popup-box { 
        background: #1a1a1a; 
        color: #eee; 
    }

    body.dark .popup-text { 
        color: #ccc; 
    }

</style>
</head>

<body>

<header>
    
    SmartApp Store
    
    <button id="themeToggle">🌙 Dark</button>
</header>

<input type="text" id="searchBox" placeholder="Search apps...">

<div class="category-area" id="categoryArea"></div>

<div class="app-list" id="appList"></div>

<!-- POPUP -->
<div class="popup-bg" id="popup">
    <div class="popup-box" id="popupBox">
        <div class="popup-title" id="pTitle"></div>
        <div class="version-text" id="pVersion"></div>
        <div class="popup-text" id="pDesc"></div>
        <a id="pDownloadLink" download>
            <button class="download-btn">Download</button>
        </a>
        <button class="close-btn" onclick="closePopup()">Close</button>
    </div>
</div>

<script>
var apps = [
    { 
        title: "ScrollStop AI", 
        desc: "Stop the scroll! Generate viral 15-second video scripts and high-converting tags for your products instantly.", 
        img:'img/scroll_stop.jpg',
        link: "apk/scroll_stop.apk", 
        version: "v1.0", 
        category: "Tools" 
    },
    { 
        title: "Auto-COC Automotive", 
        desc: "The ultimate companion for automotive mechanics. Access repair guides and technical data offline.", 
        img:'img/auto_coc_automotive.jpg',
        link: "apk/auto_coc.apk", 
        version: "v1.0", 
        category: "educational" 
    },
    { 
        title: "E-Job Ethiopia", 
        desc: "Find your next career move. Daily updates on the latest job openings across Ethiopia, accessible offline.", 
        img: "img/e_job.jpg", 
        link: "apk/e_job.apk", 
        version: "v2.1", 
        category: "Jobs" 
    },
    { 
        title: "Easy Volume Controller", 
        desc: "Take full control of your device's audio. A lightweight utility to manage volume levels with precision.", 
        img: "img/easy_volume_control.jpg", 
        link: "apk/volume_control.apk", 
        version: "v1.3", 
        category: "Utility" 
    },
    {
        title: "Push-Up Counter",
        desc: "Track your fitness journey. Hands-free push-up counting using your device's proximity sensor or screen touch.",
        img: 'img/push_up_counter.jpg',
        link: 'apk/pushup_counter.apk',
        version: 'v2.0',
        category: 'Tools'
    },
    {
        title: "USB OTG Checker",
        desc: "Quickly verify if your Android device supports USB On-The-Go (OTG) technology before you buy cables.",
        img: 'img/usb_otg_checker.jpg',
        link: 'apk/otg_checker.apk',
        version: 'v1.1',
        category: 'Utility'
    }
];

/* Create category buttons */
var categories = ["All"];
for (var i=0; i<apps.length; i++){
    if(categories.indexOf(apps[i].category) === -1){
        categories.push(apps[i].category);
    }
}

function buildCategoryButtons(){
    var area = document.getElementById("categoryArea");
    area.innerHTML = "";
    for(var i=0; i<categories.length; i++){
        var btn = document.createElement("button");
        btn.className = "cat-btn";
        btn.textContent = categories[i];
        if(i===0) btn.classList.add("active");
        btn.onclick = function(){
            var all = document.getElementsByClassName("cat-btn");
            for(var j=0;j<all.length;j++) all[j].classList.remove("active");
            this.classList.add("active");
            loadApps(this.textContent);
        };
        area.appendChild(btn);
    }
}

/* Load apps list */
function loadApps(filter){
    var list = document.getElementById("appList");
    var search = document.getElementById("searchBox").value.toLowerCase();
    list.innerHTML = "";

    for(var i=0; i<apps.length; i++){
        var a = apps[i];

        if(filter !== "All" && a.category !== filter) continue;
        if(a.title.toLowerCase().indexOf(search) === -1 && a.desc.toLowerCase().indexOf(search) === -1) continue;

        var card = document.createElement("div");
        card.className = "app-card";

        card.onclick = (function(appData){
            return function(){ openPopup(appData); };
        })(a);

        card.innerHTML = 
            "<img src='"+a.img+"'>"+
            "<div style='flex:1'>"+
                "<div class='app-title'>"+a.title+"</div>"+
                "<div class='app-desc'>"+a.desc+"</div>"+
            "</div>"+
            "<a href='"+a.link+"' download='"+a.title+".apk' onclick='event.stopPropagation();'>"+
                "<button class='download-btn'>Download</button>"+
            "</a>";

        list.appendChild(card);
    }
}

/* Popup functions */
function openPopup(app){
    document.getElementById("pTitle").textContent = app.title;
    document.getElementById("pVersion").textContent = app.version;
    document.getElementById("pDesc").textContent = app.desc;
    var link = document.getElementById("pDownloadLink");
    link.href = app.link;
    link.setAttribute("download", app.title+".apk");
    document.getElementById("popup").style.display = "flex";
}

function closePopup(){ 
    document.getElementById("popup").style.display = "none"; 
}

/* Theme toggle with emoji and text */
document.getElementById("themeToggle").onclick = function(){
    document.body.classList.toggle("dark");
    if(document.body.classList.contains("dark")){
        this.textContent = "☀️ Light";
    } else {
        this.textContent = "🌙 Dark";
    }
};

/* Live search */
document.getElementById("searchBox").oninput = function(){
    var activeCat = document.querySelector(".cat-btn.active").textContent;
    loadApps(activeCat);
};

/* Initialize */
buildCategoryButtons();
loadApps("All");

</script>

</body>
</html>
